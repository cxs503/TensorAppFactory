name: English Exam Coach Android APK

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "products/english-exam-coach/android/**"
      - ".github/workflows/english-exam-coach-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/english-exam-coach/android/**"
      - ".github/workflows/english-exam-coach-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        working-directory: products/english-exam-coach/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run end-to-end flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            mkdir -p products/english-exam-coach/android/ci-diagnostics
            adb logcat -c
            cd products/english-exam-coach/android
            if gradle --no-daemon :app:connectedDebugAndroidTest; then
              echo "instrumentation_status=passed" > ci-diagnostics/status.txt
            else
              echo "instrumentation_status=failed" > ci-diagnostics/status.txt
              adb logcat -d -v threadtime > ci-diagnostics/logcat.txt || true
              find app/build/outputs -maxdepth 5 -type f -print > ci-diagnostics/output-files.txt || true
              find app/build/reports -maxdepth 6 -type f -print > ci-diagnostics/report-files.txt || true
              exit 1
            fi
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-coach-emulator-diagnostics
          if-no-files-found: ignore
          path: |
            products/english-exam-coach/android/ci-diagnostics/**
            products/english-exam-coach/android/app/build/reports/androidTests/**
            products/english-exam-coach/android/app/build/outputs/androidTest-results/**
      - name: Build debug APK
        working-directory: products/english-exam-coach/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate checksum
        working-directory: products/english-exam-coach/android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: english-exam-coach-debug-apk
          path: |
            products/english-exam-coach/android/app/build/outputs/apk/debug/app-debug.apk
            products/english-exam-coach/android/app/build/outputs/apk/debug/app-debug.apk.sha256
