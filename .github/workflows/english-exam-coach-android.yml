name: English Exam Coach Android APK

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "products/english-exam-coach/android/**"
      - ".github/workflows/english-exam-coach-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/english-exam-coach/android/**"
      - ".github/workflows/english-exam-coach-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned canonical content source
        uses: actions/checkout@v4
        with:
          repository: cxs503/TensorProductFactory
          ref: bb59f35a49b5e346cc0f174a34eeb1062250bb40
          path: canonical-content
      - name: Verify bundled content matches canonical benchmark
        run: |
          canonical="canonical-content/benchmarks/english-exam-coach/fixtures/reading-original-v0.1.json"
          bundled="products/english-exam-coach/android/app/src/main/assets/reading-original-v0.1.json"
          test "$(git hash-object "$canonical")" = "efd5fb8413f35897cb30f3fd7b5d60058dec858f"
          cmp --silent "$canonical" "$bundled"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        working-directory: products/english-exam-coach/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run end-to-end flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd products/english-exam-coach/android && mkdir -p ci-diagnostics && adb logcat -c && if gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace; then echo instrumentation_status=passed > ci-diagnostics/status.txt; else echo instrumentation_status=failed > ci-diagnostics/status.txt; adb logcat -b all -d -v threadtime > ci-diagnostics/logcat-all.txt || true; adb shell dumpsys activity lastanr > ci-diagnostics/last-anr.txt || true; adb shell dumpsys meminfo > ci-diagnostics/meminfo.txt || true; adb shell dumpsys cpuinfo > ci-diagnostics/cpuinfo.txt || true; find app/build/outputs -maxdepth 5 -type f -print > ci-diagnostics/output-files.txt || true; find app/build/reports -maxdepth 6 -type f -print > ci-diagnostics/report-files.txt || true; exit 1; fi
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-coach-emulator-diagnostics
          if-no-files-found: ignore
          path: |
            products/english-exam-coach/android/ci-diagnostics/**
            products/english-exam-coach/android/app/build/reports/androidTests/**
            products/english-exam-coach/android/app/build/outputs/androidTest-results/**
      - name: Build debug APK
        working-directory: products/english-exam-coach/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate checksum
        working-directory: products/english-exam-coach/android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: english-exam-coach-debug-apk
          path: |
            products/english-exam-coach/android/app/build/outputs/apk/debug/app-debug.apk
            products/english-exam-coach/android/app/build/outputs/apk/debug/app-debug.apk.sha256
