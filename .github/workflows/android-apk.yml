name: Android APK

on:
  push:
    paths:
      - "templates/android-native/**"
      - "factory/**"
      - "specs/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "templates/android-native/**"
      - "factory/**"
      - "specs/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test reference APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate product manifest
        run: |
          python -m pip install -r requirements-dev.txt
          python factory/validate_manifest.py specs/examples/hello-product.json
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build product from manifest and emit evidence
        run: |
          mkdir -p generated-artifacts
          python factory/build_product.py specs/examples/hello-product.json \
            --output-dir /tmp/hello-tensor-generated \
            --result-file generated-artifacts/build-result.json
      - name: Build and test
        working-directory: templates/android-native
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Stage generated APK for artifact upload
        run: |
          test -s /tmp/hello-tensor-generated/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p generated-artifacts
          cp /tmp/hello-tensor-generated/app/build/outputs/apk/debug/app-debug.apk generated-artifacts/hello-tensor-generated-debug.apk
          test -s generated-artifacts/build-result.json
      - name: Verify APK exists and hash it
        run: |
          test -s templates/android-native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum templates/android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hello-tensor-debug-apk
          path: |
            templates/android-native/app/build/outputs/apk/debug/app-debug.apk
            generated-artifacts/hello-tensor-generated-debug.apk
          if-no-files-found: error
          retention-days: 14
