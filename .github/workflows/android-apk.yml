name: Android APK

on:
  push:
    paths:
      - "templates/android-native/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "templates/android-native/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test reference APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and test
        working-directory: templates/android-native
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK exists and hash it
        run: |
          test -s templates/android-native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum templates/android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hello-tensor-debug-apk
          path: templates/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
